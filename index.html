<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Math Battle RPG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ============ AUTH ============ -->
  <section id="screen-auth" class="screen active">
    <div class="card">
      <h1>⚔️ Math Battle RPG</h1>
      <p class="sub">ตอบเลขให้ถูก = ฟาดมอนสเตอร์</p>
      <label>ชื่อผู้เล่น</label>
      <input id="auth-name" maxlength="16" placeholder="ชื่อของคุณ" autocomplete="off">
      <label>PIN (ตัวเลข 4-6 หลัก)</label>
      <input id="auth-pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
      <button id="btn-login">เข้าสู่ระบบ / สมัคร</button>
      <button id="btn-guest" class="ghost">เล่นแบบไม่บันทึก (Guest)</button>
      <p id="auth-error" class="err"></p>
    </div>
  </section>

  <!-- ============ HERO SELECT ============ -->
  <section id="screen-hero" class="screen">
    <div class="card">
      <h1>เลือกฮีโร่</h1>
      <p class="sub">เลือกได้ครั้งเดียวตอนสมัคร</p>
      <div id="hero-grid" class="hero-grid"></div>
      <p id="hero-name" class="hero-name">— ยังไม่ได้เลือก —</p>
      <button id="btn-hero-ok" disabled>ยืนยันฮีโร่นี้</button>
    </div>
  </section>

  <!-- ============ HOME ============ -->
  <section id="screen-home" class="screen">
    <div class="card">
      <!-- กล่อง Hero-Head: แบ่งเป็น 2 คอลัมน์ด้วย Grid -->
      <div class="hero-head">
        <!-- คอลัมน์ซ้าย: รูป Avatar -->
        <div class="hero-avatar-col">
          <img id="home-hero" class="sprite" alt="">
        </div>
        
        <!-- คอลัมน์ขวา: ข้อมูล, เลเวล, แถบ HP/EXP -->
        <div class="hero-meta">
          <div class="hero-row" style="display:flex; justify-content:space-between; align-items:center;">
            <div class="hero-title" id="home-name">-</div>
            <button class="snd-btn" id="btn-sound" title="ปิดเสียง">🔊</button>
          </div>
          
          <div class="stat-line" style="margin: 6px 0 10px;">
            <span>Level <b id="home-lv">1</b></span>
            <span>💰 <b id="home-gold">0</b></span>
          </div>

          <div style="font-size:13px; color:var(--dim); margin-bottom:4px;">❤️ HP <b id="home-hp" style="color:var(--txt); font-weight:800;">80/80</b></div>
          <div class="bar hp"><i id="home-hpbar" style="width:100%"></i></div>

          <div style="font-size:13px; color:var(--dim); margin: 8px 0 4px;">⭐ EXP <span id="home-exptxt" style="color:var(--txt); font-weight:800;">0/60 EXP</span></div>
          <div class="bar exp"><i id="home-expbar" style="width:0%"></i></div>
        </div>
      </div>

      <!-- ATK, Kill และปุ่มพักฟื้น อยู่นอกกล่อง Hero-Head เพื่อให้กว้างเต็มหน้า -->
      <div class="stat-line" style="margin-top:14px">
        <span>⚔️ ATK <b id="home-atk">10</b></span>
        <span>🏆 ล้ม <b id="home-kill">0</b></span>
      </div>
      <button id="btn-rest" class="warn" style="margin-top:10px">🏕️ พักฟื้น (ใช้ 10 ทอง เต็ม HP)</button>
      
      <div id="cloud-badge" class="cloud"></div>

      <p class="sub" style="margin:16px 0 4px">เลือกพื้นที่ล่ามอนสเตอร์</p>
      <div id="area-list"></div>

      <p class="sub" style="margin:18px 0 4px">🏅 อันดับผู้เล่น</p>
      <div id="leaderboard-list"></div>
      <button id="btn-logout" class="ghost" style="margin-top:14px">ออกจากระบบ</button>
    </div>
  </section>

  <!-- ============ BATTLE ============ -->
  <section id="screen-battle" class="screen">
    <div class="card">
      <button class="snd-btn float-snd" id="btn-sound2" title="ปิดเสียง">🔊</button>
      <div class="combat">
        <div class="unit">
          <div class="nm" id="b-pname">Player</div>
          <div class="bar hp"><i id="b-phpbar" style="width:100%"></i></div>
          <div class="hpnum" id="b-phptxt">80/80</div>
          <div class="sprite-box"><img id="b-psprite" class="sprite hero" alt=""></div>
        </div>
        <div class="unit">
          <div class="nm" id="b-mname">Monster</div>
          <div class="bar mhp"><i id="b-mhpbar" style="width:100%"></i></div>
          <div class="hpnum" id="b-mhptxt">0/0</div>
          <div class="sprite-box"><img id="b-msprite" class="sprite mon-sprite" alt=""></div>
        </div>
      </div>

      <div class="qbox">
        <div class="q"><span id="b-q">1 + 1</span> <span class="qm">= ?</span></div>
        <div class="hintline" id="b-hint"></div>
      </div>

      <input id="ans" inputmode="numeric" autocomplete="off" placeholder="?" >
      <div class="combo" id="b-combo"></div>

      <div class="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="0">0</button><button data-k="-">±</button><button class="del" data-k="del">⌫</button>
        <button class="ok" id="btn-submit">โจมตี!</button>
        <button class="ghost" id="btn-flee">หนี</button>
      </div>
      <div class="log" id="b-log"></div>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="screen-result" class="screen">
    <div class="card">
      <div class="big" id="r-title">VICTORY</div>
      <div style="text-align:center"><img id="r-sprite" class="sprite" style="height:110px" alt=""></div>
      <div id="r-lvup"></div>
      <div class="reward" id="r-reward"></div>
      <div class="tally" id="r-tally"></div>
      <div id="r-weak" class="weak"></div>
      <div class="row">
        <button id="btn-again">สู้ต่อ</button>
        <button id="btn-home" class="ghost">กลับฐาน</button>
      </div>
      <p class="muted" id="r-note"></p>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
